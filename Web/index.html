<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Slides - Editor de Presentaciones</title>
    <!-- Framework W3.CSS solicitado -->
    <link rel="stylesheet" href="css/w3.css">
    <!-- Estilos específicos para Web Slides -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- ====================================================================
         BARRA SUPERIOR (HEADER PRINCIPAL CON W3.CSS)
         ==================================================================== -->
    <header class="w3-bar w3-blue w3-card" style="padding: 6px 16px; display: flex; align-items: center; justify-content: space-between;">
        <div class="w3-bar-item" style="padding: 0; display: flex; align-items: center; gap: 8px;">
            <span style="font-size: 22px; font-weight: bold; letter-spacing: 0.5px;">📑 Web slides</span>
            <span class="w3-tag w3-round w3-light-blue w3-small" style="font-weight: 500;">IndexedDB</span>
        </div>

        <!-- Acciones rápidas de presentación y diapositivas -->
        <div style="display: flex; align-items: center; gap: 8px;">
            <button id="btnAddSlide" class="w3-button w3-white w3-hover-light-grey w3-round-large w3-small" title="Añadir diapositiva">
                ➕ Nueva Diapositiva
            </button>
            <button id="btnDuplicateSlide" class="w3-button w3-blue-grey w3-round-large w3-small" title="Duplicar diapositiva actual">
                📄 Duplicar
            </button>
            <button id="btnDeleteSlide" class="w3-button w3-red w3-round-large w3-small" title="Eliminar diapositiva actual">
                🗑️ Eliminar
            </button>
            <button id="btnPresent" class="w3-button w3-green w3-round-large w3-small w3-bold" title="Iniciar presentación en pantalla completa">
                ▶️ Presentar
            </button>
        </div>

        <!-- Estado de almacenamiento en IndexedDB -->
        <div style="display: flex; align-items: center; gap: 10px;">
            <span id="saveStatus" class="w3-tag w3-round w3-white w3-text-blue" style="font-size: 11px; font-weight: 600;">
                ✓ Guardado en IndexedDB
            </span>
            <button id="btnResetAll" class="w3-button w3-pale-red w3-text-red w3-round-large w3-tiny" title="Restablecer a presentación inicial">
                ↺ Reiniciar
            </button>
        </div>
    </header>

    <!-- ====================================================================
         CONTENEDOR DE LA APLICACIÓN (3 COLUMNAS)
         1. Lista de miniaturas (0, 1, 2...)
         2. Lienzo central de edición (Slide con head, body, foot)
         3. Panel derecho de configuración (Estilo por defecto y opciones)
         ==================================================================== -->
    <div class="app-container">

        <!-- PANEL IZQUIERDO: Miniaturas de diapositivas (Slide 0, 1, 2...) -->
        <aside class="slides-sidebar">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; padding: 0 4px;">
                <span style="font-size: 12px; font-weight: bold; text-transform: uppercase; color: #666;">Diapositivas</span>
                <span id="slideCountBadge" class="w3-badge w3-blue" style="font-size: 10px;">1</span>
            </div>
            <!-- Lista de diapositivas generadas dinámicamente -->
            <div id="slidesThumbnailsList" style="display: flex; flex-direction: column; gap: 8px;"></div>
        </aside>

        <!-- ÁREA CENTRAL: Lienzo de Edición (Slide Canvas) -->
        <main class="canvas-area">
            
            <!-- Barra de formato rápido de texto -->
            <div class="formatting-toolbar">
                <button type="button" class="w3-button w3-tiny w3-round w3-light-grey" onclick="document.execCommand('bold')" title="Negrita"><b>B</b></button>
                <button type="button" class="w3-button w3-tiny w3-round w3-light-grey" onclick="document.execCommand('italic')" title="Cursiva"><i>I</i></button>
                <button type="button" class="w3-button w3-tiny w3-round w3-light-grey" onclick="document.execCommand('underline')" title="Subrayado"><u>U</u></button>
                <span style="border-right: 1px solid #ddd; margin: 0 4px;"></span>
                <button type="button" class="w3-button w3-tiny w3-round w3-light-grey" onclick="document.execCommand('insertUnorderedList')" title="Viñetas">• Lista</button>
                <button type="button" class="w3-button w3-tiny w3-round w3-light-grey" onclick="document.execCommand('insertOrderedList')" title="Lista numerada">1. Lista</button>
                <span style="border-right: 1px solid #ddd; margin: 0 4px;"></span>
                <button type="button" class="w3-button w3-tiny w3-round w3-light-grey" onclick="document.execCommand('justifyLeft')" title="Alinear a la izquierda">⬅</button>
                <button type="button" class="w3-button w3-tiny w3-round w3-light-grey" onclick="document.execCommand('justifyCenter')" title="Centrar">⬌</button>
                <button type="button" class="w3-button w3-tiny w3-round w3-light-grey" onclick="document.execCommand('justifyRight')" title="Alinear a la derecha">➡</button>
            </div>

            <!-- Marco de la diapositiva editable según el dibujo de la pizarra -->
            <div id="slideFrame" class="slide-frame format-wide">
                
                <!-- 1. Encabezado (head) con línea punteada editable -->
                <div id="slideHead" class="slide-head" contenteditable="true" spellcheck="false"></div>

                <!-- 2. Cuerpo editable central (slide body) -->
                <div class="slide-body">
                    <div id="slideTitle" class="slide-title" contenteditable="true" spellcheck="false"></div>
                    <div id="slideContent" class="slide-content-text" contenteditable="true" spellcheck="false"></div>
                </div>

                <!-- 3. Pie de página (foot) y numeración con línea punteada editable -->
                <div id="slideFooterWrapper" class="slide-footer-wrapper">
                    <div id="slideFoot" class="slide-foot" contenteditable="true" spellcheck="false"></div>
                    <div id="slideNumbering" class="slide-numbering"></div>
                </div>
            </div>

            <!-- Navegación inferior rápida de diapositivas -->
            <div style="display: flex; align-items: center; gap: 16px; margin-top: 14px;">
                <button id="btnPrevSlide" class="w3-button w3-white w3-border w3-round w3-small">◀ Anterior</button>
                <span id="slideIndicator" style="font-size: 13px; font-weight: 600; color: #555;">Diapositiva 0 de 0</span>
                <button id="btnNextSlide" class="w3-button w3-white w3-border w3-round w3-small">Siguiente ▶</button>
            </div>
        </main>

        <!-- PANEL DERECHO: Estilo por Defecto y Configuración (Basado en la pizarra) -->
        <aside class="config-sidebar">
            <h4 class="w3-medium" style="margin-top: 0; font-weight: bold; border-bottom: 2px solid var(--primary-color); padding-bottom: 6px;">
                ⚙️ Estilo por Defecto
            </h4>

            <!-- 1. Formato de pantalla: wide / standard -->
            <div class="config-section">
                <label class="config-label">Proporción de Pantalla:</label>
                <div style="display: flex; gap: 8px;">
                    <label style="flex: 1; cursor: pointer;">
                        <input class="w3-radio" type="radio" name="aspectRatio" value="wide" checked id="radioWide">
                        <span style="font-size: 13px; margin-left: 4px;">Wide (16:9)</span>
                    </label>
                    <label style="flex: 1; cursor: pointer;">
                        <input class="w3-radio" type="radio" name="aspectRatio" value="standard" id="radioStandard">
                        <span style="font-size: 13px; margin-left: 4px;">Standard (4:3)</span>
                    </label>
                </div>
            </div>

            <!-- 2. Fondo por defecto (background -> colores) -->
            <div class="config-section">
                <label class="config-label">Color de Fondo por Defecto:</label>
                <div style="display: flex; align-items: center; gap: 8px;">
                    <input type="color" id="defaultBgPicker" value="#ffffff" style="cursor: pointer; width: 40px; height: 32px; border: 1px solid #ccc; border-radius: 4px; padding: 0;">
                    <input type="text" id="defaultBgText" value="#ffffff" class="w3-input w3-border w3-round w3-small" style="padding: 4px 8px; width: 100px;">
                </div>
                <!-- Paleta de colores rápidos -->
                <div class="color-swatches" id="defaultColorSwatches">
                    <div class="color-swatch" style="background: #ffffff;" data-color="#ffffff" title="Blanco"></div>
                    <div class="color-swatch" style="background: #f8f9fa;" data-color="#f8f9fa" title="Gris Claro"></div>
                    <div class="color-swatch" style="background: #f0f4f8;" data-color="#f0f4f8" title="Azul Suave"></div>
                    <div class="color-swatch" style="background: #fefae0;" data-color="#fefae0" title="Crema"></div>
                    <div class="color-swatch" style="background: #212529;" data-color="#212529" title="Oscuro"></div>
                    <div class="color-swatch" style="background: #1e3a8a;" data-color="#1e3a8a" title="Azul Noche"></div>
                </div>
            </div>

            <!-- 3. Texto y Alineación: head / foot -->
            <div class="config-section">
                <label class="config-label">Alineación de Encabezado (head):</label>
                <select id="headAlignSelect" class="w3-select w3-border w3-round w3-small">
                    <option value="left">Izquierda (Left)</option>
                    <option value="center">Centro (Center)</option>
                    <option value="right">Derecha (Right)</option>
                </select>

                <label class="config-label" style="margin-top: 10px;">Alineación de Pie de Página (foot):</label>
                <select id="footAlignSelect" class="w3-select w3-border w3-round w3-small">
                    <option value="left">Izquierda (Left)</option>
                    <option value="center">Centro (Center)</option>
                    <option value="right">Derecha (Right)</option>
                </select>
            </div>

            <!-- 4. Numeración y Alineación -->
            <div class="config-section">
                <label class="config-label">Numeración de Diapositiva:</label>
                <label style="display: flex; align-items: center; gap: 6px; font-size: 13px; cursor: pointer; margin-bottom: 8px;">
                    <input class="w3-check" type="checkbox" id="chkShowNumbering" checked>
                    <span>Mostrar numeración</span>
                </label>
                <label class="config-label">Alineación de Numeración:</label>
                <select id="numberingAlignSelect" class="w3-select w3-border w3-round w3-small">
                    <option value="right">Derecha (Right)</option>
                    <option value="center">Centro (Center)</option>
                    <option value="left">Izquierda (Left)</option>
                </select>
            </div>

            <!-- 5. Configuración de la Diapositiva Actual (Slide 0 vs Slide N > 0) -->
            <div class="config-section" style="background: #fbfbfb; padding: 12px; border-radius: 6px; border: 1px solid #e5e5e5;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                    <label class="config-label" style="margin: 0;">Diapositiva Actual:</label>
                    <span id="currentSlideTypeBadge" class="w3-tag w3-round w3-blue w3-tiny">Slide 0 (Portada)</span>
                </div>

                <div id="slide0Notice" style="font-size: 11px; color: #666; margin-bottom: 8px; line-height: 1.3;">
                    ℹ️ <i>Slide 0 actúa como Portada principal. Por defecto oculta encabezado y pie de página para un diseño limpio.</i>
                </div>

                <!-- Personalizar fondo de esta diapositiva específica -->
                <label class="config-label" style="margin-top: 8px;">Fondo de esta Diapositiva:</label>
                <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 8px;">
                    <input type="color" id="slideCustomBgPicker" value="#ffffff" style="cursor: pointer; width: 40px; height: 32px; border: 1px solid #ccc; border-radius: 4px; padding: 0;">
                    <button id="btnResetSlideBg" class="w3-button w3-light-grey w3-round w3-tiny" title="Usar fondo por defecto">
                        Usar Fondo por Defecto
                    </button>
                </div>

                <!-- Visibilidad de head, foot y numeración para esta diapositiva -->
                <div style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; margin-top: 8px;">
                    <label style="cursor: pointer; display: flex; align-items: center; gap: 6px;">
                        <input class="w3-check" type="checkbox" id="chkSlideShowHead">
                        <span>Mostrar Encabezado (head)</span>
                    </label>
                    <label style="cursor: pointer; display: flex; align-items: center; gap: 6px;">
                        <input class="w3-check" type="checkbox" id="chkSlideShowFoot">
                        <span>Mostrar Pie de página (foot)</span>
                    </label>
                    <label style="cursor: pointer; display: flex; align-items: center; gap: 6px;">
                        <input class="w3-check" type="checkbox" id="chkSlideShowNumbering">
                        <span>Mostrar Numeración</span>
                    </label>
                </div>
            </div>

        </aside>
    </div>

    <!-- ====================================================================
         MODO PRESENTACIÓN EN PANTALLA COMPLETA
         ==================================================================== -->
    <div id="presentationOverlay" class="presentation-overlay">
        <div class="presentation-slide-container">
            <div id="presentationSlideFrame" class="slide-frame format-wide">
                <div id="presHead" class="slide-head"></div>
                <div class="slide-body">
                    <div id="presTitle" class="slide-title"></div>
                    <div id="presContent" class="slide-content-text"></div>
                </div>
                <div id="presFooterWrapper" class="slide-footer-wrapper">
                    <div id="presFoot" class="slide-foot"></div>
                    <div id="presNumbering" class="slide-numbering"></div>
                </div>
            </div>
        </div>

        <!-- Controles flotantes en modo presentación -->
        <div class="presentation-controls">
            <button id="btnPresPrev" class="w3-button w3-text-white w3-hover-blue w3-round">◀ Anterior</button>
            <span id="presSlideIndicator" style="font-size: 13px;">1 / 1</span>
            <button id="btnPresNext" class="w3-button w3-text-white w3-hover-blue w3-round">Siguiente ▶</button>
            <button id="btnExitPres" class="w3-button w3-red w3-round w3-small" style="margin-left: 8px;">✕ Salir (ESC)</button>
        </div>
    </div>

    <!-- Scripts de la aplicación -->
    <script src="js/db.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
